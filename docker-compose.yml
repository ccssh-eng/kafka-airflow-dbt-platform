services:

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  kafka:
    image: apache/kafka:4.2.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093,BOOTSTRAP://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092,BOOTSTRAP://kafka:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:SASL_SSL,EXTERNAL:SASL_SSL,CONTROLLER:PLAINTEXT,BOOTSTRAP:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_SSL_KEYSTORE_LOCATION: /etc/kafka/secrets/kafka.keystore.jks
      KAFKA_SSL_KEYSTORE_PASSWORD: ${KAFKA_SSL_KEYSTORE_PASSWORD}
      KAFKA_SSL_KEY_PASSWORD: ${KAFKA_SSL_KEY_PASSWORD}
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/kafka.truststore.jks
      KAFKA_SSL_TRUSTSTORE_PASSWORD: ${KAFKA_SSL_TRUSTSTORE_PASSWORD}
      KAFKA_SSL_CLIENT_AUTH: none
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_server_jaas.conf"
    volumes:
      - ./certs/kafka:/etc/kafka/secrets:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9094 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    image: apache/kafka:4.2.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka:9094 \
          --alter --add-config "SCRAM-SHA-256=[password=${KAFKA_SASL_PASSWORD}]" \
          --entity-type users --entity-name ${KAFKA_SASL_USERNAME}
        /opt/kafka/bin/kafka-topics.sh --create --if-not-exists \
          --topic orders --bootstrap-server kafka:9094 \
          --partitions 1 --replication-factor 1
    environment:
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}

  consumer:
    build:
      context: ./consumer
    container_name: consumer
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    volumes:
      - ./certs/ca-cert.pem:/app/certs/ca-cert.pem:ro

  producer:
    build:
      context: ./producer
    container_name: producer
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_SASL_USERNAME: ${KAFKA_SASL_USERNAME}
      KAFKA_SASL_PASSWORD: ${KAFKA_SASL_PASSWORD}
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./certs/ca-cert.pem:/app/certs/ca-cert.pem:ro
      - ./producer/data:/app/data


  airflow-meta-db-init:
    image: postgres:16
    container_name: airflow-meta-db-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    entrypoint:
      - sh
      - -c
      - >
        psql -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tc
        "SELECT 1 FROM pg_database WHERE datname = 'airflow_meta'"
        | grep -q 1 ||
        psql -h postgres -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c "CREATE DATABASE airflow_meta"

  airflow-init:
    build:
      context: ./airflow
    image: kafka-airflow-dbt-airflow:latest
    container_name: airflow-init
    depends_on:
      airflow-meta-db-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/airflow_meta
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: "${AIRFLOW_WEBSERVER_SECRET_KEY}"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__WEB_SERVER_MASTER_TIMEOUT: "300"
      AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1"
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD} 
      AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX: "True"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./PostgreSQL:/opt/dbt/project
      - ./airflow/dbt_profiles:/opt/dbt/profiles
    entrypoint: /bin/bash
    command:
      - -c
      - |
        if ! whoami &> /dev/null; then
          echo "airflow:x:$(id -u):0:airflow:$${AIRFLOW_HOME}:/bin/bash" >> /etc/passwd
        fi
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USER}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@example.com || true

  airflow:
    build:
      context: ./airflow
    image: kafka-airflow-dbt-airflow:latest
    container_name: airflow
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    user: "${AIRFLOW_UID:-50000}:0"
    environment: *airflow-env
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./PostgreSQL:/opt/dbt/project
      - ./airflow/dbt_profiles:/opt/dbt/profiles
    ports:
      - "127.0.0.1:8080:8080"
    command: standalone

    restart: unless-stopped
    labels:
      - "autoheal=true"
    healthcheck:
      test:
        - CMD-SHELL
        - >
          curl -sf http://localhost:8080/health |
          python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('scheduler',{}).get('status')=='healthy' else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  autoheal:
    image: willfarrell/autoheal
    container_name: autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  nginx:
    image: nginx:alpine
    depends_on:
      - airflow
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs/nginx:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  postgres_data:

